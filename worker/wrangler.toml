name = "meu-treino-assistant"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
# Modelo principal do Groq e modelo de fallback (console.groq.com/docs/models)
GROQ_MODEL = "openai/gpt-oss-120b"
GROQ_FALLBACK_MODEL = "llama-3.3-70b-versatile"

# Esforço de raciocínio enviado apenas para modelos gpt-oss ("low" | "medium" | "high")
GROQ_REASONING_EFFORT = "medium"

# Projeto Firebase para validação do JWT (iss e aud) e acesso REST ao Firestore
FIREBASE_PROJECT_ID = "meu-treino-2007"

# UID do proprietário (único autorizado a usar as ferramentas do Google Calendar e com cota de 150 msgs / 30 fotos por dia)
OWNER_UID = "tH4A7sYnH1WDUdBVDd1mfltMPdj2"

# Lista explícita de UIDs autorizados separados por vírgula (NÃO aceita "*").
# Adicione os 3 UIDs das contas secundárias após criá-las no Firebase Console:
# Ex.: ALLOWED_UIDS = "tH4A7sYnH1WDUdBVDd1mfltMPdj2,UID_NAMORADA,UID_PAI,UID_MAE"
ALLOWED_UIDS = "tH4A7sYnH1WDUdBVDd1mfltMPdj2"

# Origens permitidas no CORS (separadas por vírgula)
ALLOWED_ORIGINS = "https://ianrtaniguchi.github.io,http://localhost:5173"

# Secrets obrigatórios no Worker:
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put FCM_SERVICE_ACCOUNT
# Para habilitar a agenda (Google Calendar, exclusiva do OWNER_UID):
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put GOOGLE_REFRESH_TOKEN

[triggers]
crons = ["*/5 * * * *"]
