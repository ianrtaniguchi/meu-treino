<!doctype html>
<html lang="pt-BR" data-theme="dark" style="background-color: #0d1117;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meu Treino" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="alternate icon" type="image/png" href="%BASE_URL%favicon.png" />
    <title>Meu Treino</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('meu-treino-theme');
          if (t !== 'light' && t !== 'baby' && t !== 'dark') t = 'dark';
          var bg = t === 'light' ? '#f4f6f9' : t === 'baby' ? '#fff3f7' : '#0d1117';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.backgroundColor = bg;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
